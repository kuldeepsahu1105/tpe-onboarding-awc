---
# Namespaced writes under strict ACE RBAC. ace-hub aggregates this Role into the
# engine's namespace-scoped role. This engine has no chart yet. The rules below
# are the Helm shape to keep once a chart and template exist: release storage,
# typical chart objects, the credential Secret, and AuthConfig.
# Flux helm-controller applies a chart release while impersonating the engine
# ServiceAccount. Legacy mode applies the RoleBinding below as written.
#
# `secrets` is Helm's storage driver. Without list on secrets the release fails
# before creating anything: "cannot list resource secrets in API group".
# `patch` is required because applies go through server-side apply.
# replicasets and endpointslices are read-only, for Helm wait.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tpe-onboarding-engine-namespaced-role
rules:
- apiGroups:
  - ''
  resources:
  - configmaps
  - persistentvolumeclaims
  - secrets
  - serviceaccounts
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  - statefulsets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - replicasets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - discovery.k8s.io
  resources:
  - endpointslices
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - security.awc.cloudera.com
  resources:
  - authconfigs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - source.toolkit.fluxcd.io
  resources:
  - helmrepositories
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - helm.toolkit.fluxcd.io
  resources:
  - helmreleases
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tpe-onboarding-engine-namespaced-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tpe-onboarding-engine-namespaced-role
subjects:
- kind: ServiceAccount
  name: ace-operator-controller-manager
  namespace: ace-operator-system
