# Example input form — regenerates the neo4j/ plugin (Helm-first pattern).
# Usage from repo root:
#   make discover-images REPO_URL=https://helm.neo4j.com/neo4j CHART=neo4j VERSION=2025.12.1 \
#     FORM=tools/engine-onboarding/examples/neo4j.input_form.yaml WRITE=1
#   make scaffold-engine FORM=tools/engine-onboarding/examples/neo4j.input_form.yaml FORCE=1
version: v1
directory: neo4j

engine:
  name: neo4j-engine
  displayName: Neo4j
  description: >
    Neo4j is a native graph database for connected data. This engine deploys a
    standalone Neo4j server using the official Neo4j Helm chart with persistent
    storage and generated credentials.

imageCatalog:
  name: neo4j-images-5-26-0
  images:
    - id: neo4j
      registry: docker-private.infra.cloudera.com
      repository: cloudera_thirdparty/hardened/neo4j
      tag: "5.26.0-r0-202610191200"

chartCatalog:
  name: neo4j-charts-2025-12-1
  charts:
    - id: neo4j
      registry: docker-private.infra.cloudera.com
      repository: cloudera-thirdparty-helm/neo4j
      version: "2025.12.1"

helm:
  chartID: neo4j
  values: |
    disableLookups: true
    fullnameOverride: {{ .Metadata.Name | quote }}
    neo4j:
      name: {{ .Metadata.Name | quote }}
      edition: {{ .Config.edition | quote }}
      acceptLicenseAgreement: {{ .Config.acceptLicenseAgreement | quote }}
      passwordFromSecret: {{ .Metadata.Name }}-auth
      resources:
        requests:
          cpu: {{ .Config.cpu | quote }}
          memory: {{ .Config.memory | quote }}
        limits:
          cpu: {{ .Config.cpuLimit | quote }}
          memory: {{ .Config.memoryLimit | quote }}
    volumes:
      data:
        mode: defaultStorageClass
        defaultStorageClass:
          accessModes:
            - ReadWriteOnce
          requests:
            storage: {{ .Config.storageSize | quote }}
    image:
      registry: {{ .Image.neo4j.registry | quote }}
      repository: {{ .Image.neo4j.repository | quote }}
      tag: {{ .Image.neo4j.tag | quote }}

features:
  generatedCredentials:
    enabled: true
    username: neo4j
    secretSuffix: "-auth"
    extraB64EncData:
      NEO4J_AUTH: '(printf "neo4j/%s" $password)'
  authConfig:
    enabled: true
    configKey: istioEnabled

provides:
  - name: credentials
    secret:
      selector:
        matchLabels:
          ace.cloudera.com/provides: credentials
      index: username
  - name: boltEndpoint
    capability: endpoint
    value: |
      url: "bolt://{{ .Metadata.Name }}.{{ .Metadata.Namespace }}.svc.cluster.local:7687"
  - name: browserEndpoint
    capability: landing-page
    value: |
      url: "http://{{ .Metadata.Name }}.{{ .Metadata.Namespace }}.svc.cluster.local:7474"
      navGroup: data-apps
  - name: graphDatabase
    capability: neo4j-graph-database
    value: |
      endpoint:
        bolt:
          host: "{{ .Metadata.Name }}.{{ .Metadata.Namespace }}.svc.cluster.local"
          port: 7687
        http:
          host: "{{ .Metadata.Name }}.{{ .Metadata.Namespace }}.svc.cluster.local"
          port: 7474
      credentials:
        secretRef:
          name: {{ .Metadata.Name }}-auth
          namespace: {{ .Metadata.Namespace }}
        usernameKey: username
        passwordKey: password

capabilities:
  - metadata:
      name: neo4j-graph-database
    spec:
      schema:
        type: object
        description: "In-cluster Neo4j graph database connection (Bolt and HTTP browser endpoints)."
        required:
          - endpoint
          - credentials
        properties:
          endpoint:
            type: object
            required:
              - bolt
              - http
            properties:
              bolt:
                type: object
                required:
                  - host
                  - port
                properties:
                  host:
                    type: string
                  port:
                    type: integer
              http:
                type: object
                required:
                  - host
                  - port
                properties:
                  host:
                    type: string
                  port:
                    type: integer
          credentials:
            type: object
            required:
              - secretRef
              - usernameKey
              - passwordKey
            properties:
              secretRef:
                type: object
                required:
                  - name
                  - namespace
                properties:
                  name:
                    type: string
                  namespace:
                    type: string
              usernameKey:
                type: string
              passwordKey:
                type: string

configSchema:
  type: object
  properties:
    edition:
      type: string
      default: community
      enum:
        - community
        - enterprise
      title: "Neo4j Edition"
      description: "Neo4j edition to deploy. Enterprise requires a valid license and acceptLicenseAgreement."
    acceptLicenseAgreement:
      type: string
      default: "no"
      enum:
        - "no"
        - "yes"
        - "eval"
      title: "License Agreement"
      description: "Set to yes with a valid Enterprise license, or eval for evaluation. Required when edition is enterprise."
    storageSize:
      type: string
      default: "10Gi"
      title: "Storage Size"
      description: "Persistent volume size for Neo4j data (for example 10Gi, 50Gi, 100Gi)."
      pattern: '^[0-9]+(\.[0-9]+)?(Ei|Pi|Ti|Gi|Mi|Ki|E|P|T|G|M|k|m)?$'
    cpu:
      type: string
      default: "1000m"
      title: "CPU Request"
      description: "CPU request for the Neo4j container. Neo4j Helm requires at least 500m."
      pattern: '^([0-9]+m|[0-9]+(\.[0-9]+)?)$'
    memory:
      type: string
      default: "2Gi"
      title: "Memory Request"
      description: "Memory request for the Neo4j container. Neo4j Helm requires at least 2Gi."
      pattern: '^[0-9]+(\.[0-9]+)?(Ei|Pi|Ti|Gi|Mi|Ki|E|P|T|G|M|k|m)?$'
    cpuLimit:
      type: string
      default: "2000m"
      title: "CPU Limit"
      description: "Optional CPU limit for the Neo4j container (for example 2000m)."
      pattern: '^([0-9]+m|[0-9]+(\.[0-9]+)?)$'
    memoryLimit:
      type: string
      default: "4Gi"
      title: "Memory Limit"
      description: "Optional memory limit for the Neo4j container (for example 4Gi)."
      pattern: '^[0-9]+(\.[0-9]+)?(Ei|Pi|Ti|Gi|Mi|Ki|E|P|T|G|M|k|m)?$'
    istioEnabled:
      type: boolean
      default: true
      title: "Istio AWC Auth"
      description: "When true, enables AWC authentication integration via AuthConfig for the instance namespace."

healthChecks:
  - resource:
      apiVersion: "apps/v1"
      kind: "StatefulSet"
      name: "{{ .Metadata.Name }}"
    expression: |
      has(resource.status) &&
      has(resource.status.readyReplicas) &&
      resource.status.readyReplicas >= 1

rbac:
  preset: helm-auth

blueprint:
  enabled: true
  name: neo4j-blueprint
  description: >
    Deploy Neo4j as a standalone graph database with persistent storage,
    Bolt and browser endpoints, and credentials managed by the ACE engine.
  outcome: Neo4j Graph Database
  minimumVersion: "5.26.0"
  instanceName: neo4j
  uiDisplayName: Neo4j Graph Database
  hardwareTier:
    nodeGroupId: neo4j-nodes
    displayName: Neo4j Nodes
    description: Memory-oriented nodes for the Neo4j graph database.
    nodeCountDefault: 1
    nodeCountMinimum: 1
    nodeCountHint: "Use 1 for development; scale the cluster separately for HA topologies."
    cpuMinimum: "2"
    memoryMinimum: 8Gi
    cpuRecommended: "4"
    memoryRecommended: 16Gi
    resourcesHint: >
      Neo4j is heap- and page-cache sensitive; allocate at least 8 Gi memory
      for small workloads and 16 Gi or more for production graphs.
    diskDefault: 100Gi
    diskMinimum: 30Gi
    diskHint: "Root disk for OS and images; graph data uses a separate PVC from engine config."

exampleInstance:
  name: neo4j
  config:
    edition: community
    acceptLicenseAgreement: "no"
    storageSize: "10Gi"
    cpu: "1000m"
    memory: "2Gi"
    cpuLimit: "2000m"
    memoryLimit: "4Gi"
    istioEnabled: true

mirror:
  chart:
    repoUrl: https://helm.neo4j.com/neo4j
    name: neo4j
    version: "5.26.0"
  images:
    - source: docker.io/neo4j:5.26.0-community
      repository: neo4j
      tag: 5.26.0-community

publish:
  enabled: true
  destinationRegistry: docker-sandbox.infra.cloudera.com
  namespace: nijjwol-awc
  version: "5.26.0"
  schemaVersion: 1
  skipImagesAndChartsOnPublish: true

ociRegister:
  enabled: true
  registryHost: docker-sandbox.infra.cloudera.com
  marketplacePrefix: nijjwol-awc
  auth:
    kind: basic
    username: partner
    passwordFile: /path/to/registry-password

readme:
  enabled: false
  title: Neo4j ACE Engine
  architectureNotes: |
    Standalone Neo4j via official Helm chart; Bolt 7687 and browser 7474.
