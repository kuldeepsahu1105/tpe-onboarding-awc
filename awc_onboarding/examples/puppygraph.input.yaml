# PuppyGraph: zero-ETL graph over lakehouse data. Depends on an existing
# Hive Metastore engine instance (type: ref). Chart/image already in the
# partner registry in the reference repo, so mirror is skipped here; remove
# `mirror.skip` and set helm.repoUrl to your upstream chart repo to mirror it.
partner: {id: puppygraph, owner: "PuppyGraph"}
engine: {displayName: "PuppyGraph", description: "Zero-ETL graph query engine over existing relational/lakehouse data.", template: helm-multi-role, roles: [{name: controlplane, replicas: 1}, {name: leader, replicas: 1}, {name: compute, replicas: 1}], version: "1.1.0"}
helm: {repoUrl: "oci://registry.partner-corp.example.com/puppygraph/charts", chart: puppygraph, version: "1.0.0"}
images:
  - {id: puppygraph, ref: "docker.io/puppygraph/puppygraph:1.1.0"}
service: {port: 8081, hasLandingPage: true}
dependencies:
  hasAny: true
  entries:
    - {name: catalog, engine: hive-metastore-engine, type: ref, instance: hive-metastore}
blueprint: {needed: true, outcome: "Zero-ETL graph queries"}
cluster: {minCpu: "4", minMemory: "16Gi"}
mirror: {skip: true}
publish: {destinationRegistry: "registry.partner-corp.example.com", namespace: puppygraph}
