apiVersion: ecosystem.awc.cloudera.com/v1alpha10
kind: Engine
metadata:
  name: puppygraph-ace-engine
  annotations:
    ecosystem.awc.cloudera.com/requires-embedded-registry: "true"
spec:
  displayName: "PuppyGraph"
  description: "PuppyGraph 1.x graph query engine deployed via Flux HelmRelease."
  # Multi-role chart: controlplane, leader, compute.
  # Add/remove roles below and in configSchema/template to match your chart's
  # real values.yaml role keys (e.g. controlplane/compute, FE/BE, leader/worker).

  versionCatalog:
    - displayName: "1.1.0"
      imageCatalog: puppygraph-images-1-1-0
      chartCatalog: puppygraph-charts-1-0-0
      metadata:
        buildVersion: "1.1.0"

  configSchema:
    type: object
    properties:
      controlplaneReplicas:
        type: integer
        default: 1
        minimum: 1
        description: "Number of controlplane replicas"
      leaderReplicas:
        type: integer
        default: 1
        minimum: 1
        description: "Number of leader replicas"
      leaderCpu:
        type: string
        default: "2"
        description: "CPU request/limit per leader pod"
      leaderMemory:
        type: string
        default: "8Gi"
        description: "Memory request/limit per leader pod"
      computeReplicas:
        type: integer
        default: 1
        minimum: 1
        description: "Number of compute replicas"
      computeCpu:
        type: string
        default: "6"
        description: "CPU request/limit per compute pod"
      computeMemory:
        type: string
        default: "24Gi"
        description: "Memory request/limit per compute pod"
      storageSize:
        type: string
        default: "200Gi"
        description: "PVC size for PuppyGraph storage"
      priorityIpCidr:
        type: string
        default: ""
        description: "Cluster node IP CIDR for env.common.PRIORITY_IP_CIDR (recommended)"
      username:
        type: string
        default: "puppygraph"
        description: "Initial PuppyGraph UI username"
      password:
        type: string
        default: "changeme"
        description: "Initial PuppyGraph UI password (override in production)"

  provides:
    - name: landingPage
      capability: landing-page
      value: |
        url: "https://puppygraph-{{ .Metadata.Namespace }}.apps.{{ .Cluster.DomainName }}"
    - name: endpoint
      capability: endpoint
      value: |
        url: "http://{{ .Metadata.Name }}-controlplane-service.{{ .Metadata.Namespace }}.svc.cluster.local:8081"

  healthChecks:
    - resource:
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        name: "{{ .Metadata.Name }}"
      condition:
        type: Ready
        status: "True"

  template: |
    apiVersion: security.awc.cloudera.com/v1alpha1
    kind: AuthConfig
    metadata:
      name: default
      namespace: "{{ .Metadata.Namespace }}"
    spec:
      meshMode: Ambient
      enableAWCAuth: false
    ---
    apiVersion: source.toolkit.fluxcd.io/v1
    kind: HelmRepository
    metadata:
      name: "{{ .Metadata.Name }}-repo"
    spec:
      interval: 5m
      type: oci
      url: oci://{{ .Chart.puppygraph.registry }}/{{ dir .Chart.puppygraph.repository }}
    ---
    apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    metadata:
      name: "{{ .Metadata.Name }}"
    spec:
      interval: 1m
      timeout: 20m
      install:
        createNamespace: true
        timeout: 15m
        remediation:
          retries: 3
      targetNamespace: "{{ .Metadata.Namespace }}"
      chart:
        spec:
          chart: "{{ base .Chart.puppygraph.repository }}"
          version: "{{ .Chart.puppygraph.version }}"
          sourceRef:
            kind: HelmRepository
            name: "{{ .Metadata.Name }}-repo"
            namespace: "{{ .Metadata.Namespace }}"
      values:
        nameOverride: "{{ .Metadata.Name }}"
        image:
          repository: "{{ .Image.puppygraph.registry }}/{{ .Image.puppygraph.repository }}"
          tag: "{{ .Image.puppygraph.tag }}"
          pullPolicy: Always
        controlplane:
          replicas: "{{ .Config.controlplaneReplicas }}"
        leader:
          replicas: "{{ .Config.leaderReplicas }}"
          resources:
            requests:
              cpu: "{{ .Config.leaderCpu }}"
              memory: "{{ .Config.leaderMemory }}"
            limits:
              cpu: "{{ .Config.leaderCpu }}"
              memory: "{{ .Config.leaderMemory }}"
        compute:
          replicas: "{{ .Config.computeReplicas }}"
          resources:
            requests:
              cpu: "{{ .Config.computeCpu }}"
              memory: "{{ .Config.computeMemory }}"
            limits:
              cpu: "{{ .Config.computeCpu }}"
              memory: "{{ .Config.computeMemory }}"
        secrets:
          create: true
          PUPPYGRAPH_USERNAME: '{{ .Config.username }}'
          PUPPYGRAPH_PASSWORD: '{{ .Config.password }}'
        service:
          controlplane:
            type: ClusterIP
          query:
            type: ClusterIP
        storage:
          size: '{{ .Config.storageSize }}'
        env:
          common:
            PRIORITY_IP_CIDR: '{{ .Config.priorityIpCidr }}'

    ---
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: "{{ .Metadata.Name }}-landing"
    spec:
      hostnames:
        - "puppygraph-{{ .Metadata.Namespace }}.apps.{{ .Cluster.DomainName }}"
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: default-awc
          namespace: istio-ingress
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - kind: Service
              name: "{{ .Metadata.Name }}-controlplane-service"
              port: 8081
