# Apply on an AWC cluster to deploy this engine directly (no Blueprint).
apiVersion: ecosystem.awc.cloudera.com/v1alpha10
kind: EngineInstance
metadata:
  name: puppygraph
spec:
  engine: puppygraph-ace-engine
  version: 1.1.0
  config:
    controlplaneReplicas: 1
    leaderReplicas: 1
    leaderCpu: '2'
    leaderMemory: 8Gi
    computeReplicas: 1
    computeCpu: '6'
    computeMemory: 24Gi
    storageSize: 200Gi
    priorityIpCidr: ''
    username: puppygraph
    password: changeme
