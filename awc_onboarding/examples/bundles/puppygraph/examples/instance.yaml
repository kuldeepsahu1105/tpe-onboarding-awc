# Apply on an AWC cluster to deploy this engine directly (no Blueprint).
apiVersion: ecosystem.awc.cloudera.com/v1alpha9
kind: EngineInstance
metadata:
  name: puppygraph
spec:
  engine: puppygraph-ace-engine
  version: 1.1.0
  config:
    controlplaneReplicas: 1
    controlplaneCpu: '8'
    controlplaneMemory: 32Gi
    controlplaneStorageSize: 100Gi
    leaderReplicas: 1
    leaderCpu: '8'
    leaderMemory: 32Gi
    leaderStorageSize: 100Gi
    computeReplicas: 1
    computeCpu: '8'
    computeMemory: 32Gi
    computeStorageSize: 100Gi
