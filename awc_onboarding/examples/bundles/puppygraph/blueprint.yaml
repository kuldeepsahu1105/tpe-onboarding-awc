apiVersion: ecosystem.awc.cloudera.com/v1alpha10
kind: Blueprint
metadata:
  name: puppygraph
spec:
  owner: "PuppyGraph"
  displayName: "PuppyGraph"
  description: "Zero ETL graph on lakehouse data via Helm on AWC."
  outcome: "Zero-ETL graph queries"

  versionMatrix:
    - displayVersion: "1.1.0"
      instances:
        - name: "puppygraph"
          version: "1.1.0"

  instances:
    - name: "puppygraph"
      engine: "puppygraph-ace-engine"

  cluster:
    kubernetesVersion: ">= 1.28.0"
    networkStorage:
      default: "200Gi"
      minimum: "100Gi"
      hint: "Shared storage for PuppyGraph"
    nodeGroups:
      - id: "puppygraph-nodes"
        category: "worker"
        displayName: "PuppyGraph Nodes"
        nodeCount:
          default: 2
          minimum: 1
        resources:
          minimum:
            cpu: "8"
            memory: "32Gi"
            hasGPU: false
          recommended:
            cpu: "16"
            memory: "32Gi"
            hasGPU: false
        storage:
          disk:
            default: "200Gi"
            minimum: "100Gi"
