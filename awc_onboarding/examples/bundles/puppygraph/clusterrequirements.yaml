# Infra sizing metadata. Only consumed by the Anywhere Cloud Console when this
# product is part of a Blueprint; otherwise purely documentation for anyone
# deploying the EngineInstance manually (Path B).
apiVersion: ecosystem.awc.cloudera.com/v1alpha9
kind: ClusterRequirements
metadata:
  name: puppygraph-requirements
spec:
  kubernetesVersion: ">= 1.28.0"

  networkStorage:
    default: "100Gi"
    minimum: "50Gi"
    hint: "Shared storage for PuppyGraph data"

  nodeGroups:
    - id: "puppygraph-nodes"
      category: "worker"
      displayName: "PuppyGraph Nodes"
      description: "Nodes for PuppyGraph workloads"
      nodeCount:
        default: 1
        minimum: 1
      resources:
        minimum:
          cpu: "8"
          memory: "32Gi"
          hasGPU: false
        recommended:
          cpu: "16"
          memory: "32Gi"
          hasGPU: false
      storage:
        disk:
          default: "100Gi"
          minimum: "50Gi"
