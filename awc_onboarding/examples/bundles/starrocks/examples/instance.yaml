# Apply on an AWC cluster to deploy this engine directly (no Blueprint).
apiVersion: ecosystem.awc.cloudera.com/v1alpha9
kind: EngineInstance
metadata:
  name: starrocks
spec:
  engine: starrocks-ace-engine
  version: 1.11.4
  config:
    feReplicas: 1
    beReplicas: 1
    feCpu: '2'
    feMemory: 4Gi
    feMetaStorageSize: 10Gi
    feLogStorageSize: 5Gi
    beCpu: '2'
    beMemory: 4Gi
    beStorageSize: 20Gi
    beLogStorageSize: 1Gi
