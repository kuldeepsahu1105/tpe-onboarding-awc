apiVersion: ecosystem.awc.cloudera.com/v1alpha10
kind: Blueprint
metadata:
  name: puppygraph
spec:
  outcome: "PuppyGraph"
  owner: "PuppyGraph"
  description: "Query relational and lakehouse data as a graph without ETL. Deploys PuppyGraph 1.x via Helm on AWC."

  instances:
    - name: "puppygraph"
      engine: "puppygraph-plugin"
      minimumVersion: "1.1.0"

  hardwareTiers:
    - name: default
      cluster:
        kubernetesVersion: "v1.33.5"
        nodeGroups:
          - id: "puppygraph-compute"
            category: "worker"
            displayName: "PuppyGraph Nodes"
            description: "Nodes for PuppyGraph controlplane, leader, and compute workloads"
            nodeCount:
              default: 2
              minimum: 1
              hint: "Use 1 node for minimal dev; 3+ for HA"
            resources:
              minimum:
                cpu: "8"
                memory: "32Gi"
                hasGPU: false
              recommended:
                cpu: "16"
                memory: "64Gi"
                hasGPU: false
              hint: "Demo/dev fits m6i.2xlarge (8 vCPU, 32 GiB) with reduced Helm resources. Production: m6i.4xlarge or r6i.8xlarge class nodes."
            storage:
              disk:
                default: "200Gi"
                minimum: "100Gi"
                hint: "Node disk plus PuppyGraph PVC (storage.size)"
