apiVersion: ecosystem.awc.cloudera.com/v1alpha10
kind: Capability
metadata:
  name: neo4j-graph-database
spec:
  schema:
    type: object
    description: In-cluster Neo4j graph database connection (Bolt and HTTP browser
      endpoints).
    required:
    - endpoint
    - credentials
    properties:
      endpoint:
        type: object
        required:
        - bolt
        - http
        properties:
          bolt:
            type: object
            required:
            - host
            - port
            properties:
              host:
                type: string
              port:
                type: integer
          http:
            type: object
            required:
            - host
            - port
            properties:
              host:
                type: string
              port:
                type: integer
      credentials:
        type: object
        required:
        - secretRef
        - usernameKey
        - passwordKey
        properties:
          secretRef:
            type: object
            required:
            - name
            - namespace
            properties:
              name:
                type: string
              namespace:
                type: string
          usernameKey:
            type: string
          passwordKey:
            type: string
