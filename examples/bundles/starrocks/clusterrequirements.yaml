# Infra sizing metadata. Only consumed by the Anywhere Cloud Console when this
# product is part of a Blueprint; otherwise purely documentation for anyone
# deploying the EngineInstance manually (Path B).
apiVersion: ecosystem.awc.cloudera.com/v1alpha10
kind: ClusterRequirements
metadata:
  name: starrocks-requirements
spec:
  kubernetesVersion: ">= 1.28.0"

  networkStorage:
    default: "100Gi"
    minimum: "50Gi"
    hint: "Shared storage for StarRocks data"

  nodeGroups:
    - id: "starrocks-nodes"
      category: "worker"
      displayName: "StarRocks Nodes"
      description: "Nodes for StarRocks workloads"
      nodeCount:
        default: 1
        minimum: 1
      resources:
        minimum:
          cpu: "8"
          memory: "32Gi"
          hasGPU: false
        recommended:
          cpu: "16"
          memory: "32Gi"
          hasGPU: false
      storage:
        disk:
          default: "100Gi"
          minimum: "50Gi"
