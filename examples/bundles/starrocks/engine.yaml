apiVersion: ecosystem.awc.cloudera.com/v1alpha10
kind: Engine
metadata:
  name: starrocks-ace-engine
  annotations:
    ecosystem.awc.cloudera.com/requires-embedded-registry: "true"
spec:
  displayName: "StarRocks"
  description: "Blazing-fast OLAP analytics engine (FE + BE) via the kube-starrocks chart."
  # Multi-role chart: fe, be.
  # Add/remove roles below and in configSchema/template to match your chart's
  # real values.yaml role keys (e.g. controlplane/compute, FE/BE, leader/worker).

  versionCatalog:
    - displayName: "1.11.4"
      imageCatalog: starrocks-images-1-11-4
      chartCatalog: starrocks-charts-1-11-4
      metadata:
        buildVersion: "1.11.4"

  configSchema:
    type: object
    properties:
      feReplicas:
        type: integer
        minimum: 1
        default: 1
        description: "Number of FE (Frontend) replicas"
        title: "FE Replicas"
      beReplicas:
        type: integer
        minimum: 1
        default: 1
        description: "Number of BE (Backend) replicas"
        title: "BE Replicas"
      feCpu:
        type: string
        default: "2"
        description: "CPU request and limit for each FE pod"
        title: "FE CPU"
      feMemory:
        type: string
        default: "4Gi"
        description: "Memory request and limit for each FE pod"
        title: "FE Memory"
      feMetaStorageSize:
        type: string
        default: "10Gi"
        description: "FE metadata PVC size"
        title: "FE Meta Storage"
      feLogStorageSize:
        type: string
        default: "5Gi"
        description: "FE log PVC size"
        title: "FE Log Storage"
      beCpu:
        type: string
        default: "2"
        description: "CPU request and limit for each BE pod"
        title: "BE CPU"
      beMemory:
        type: string
        default: "4Gi"
        description: "Memory request and limit for each BE pod"
        title: "BE Memory"
      beStorageSize:
        type: string
        default: "20Gi"
        description: "BE data PVC size"
        title: "BE Storage"
      beLogStorageSize:
        type: string
        default: "1Gi"
        description: "BE log PVC size"
        title: "BE Log Storage"

  provides:
    - name: starrocksLandingPage
      capability: landing-page
      value: |
        url: "https://{{ .Metadata.Name }}.{{ .Cluster.DomainName }}"

    - name: starrocksCluster
      capability: starrocks-cluster
      value: |
        queryEndpoint:
          host: "{{ .Metadata.Name }}-fe-service.{{ .Metadata.Namespace }}.svc.cluster.local"
          port: 9030
        httpEndpoint:
          host: "{{ .Metadata.Name }}-fe-service.{{ .Metadata.Namespace }}.svc.cluster.local"
          port: 8030

  healthChecks:
    - resource:
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        name: "{{ .Metadata.Name }}"
      condition:
        type: Ready
        status: "True"

  template: |
    apiVersion: security.awc.cloudera.com/v1alpha1
    kind: AuthConfig
    metadata:
      name: default
      namespace: "{{ .Metadata.Namespace }}"
    spec:
      meshMode: Ambient
      enableAWCAuth: false
    ---
    apiVersion: source.toolkit.fluxcd.io/v1
    kind: HelmRepository
    metadata:
      name: "{{ .Metadata.Name }}-repo"
    spec:
      interval: 5m
      type: oci
      url: oci://{{ .Chart.kubeStarrocks.registry }}/{{ dir .Chart.kubeStarrocks.repository }}
    ---
    apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    metadata:
      name: "{{ .Metadata.Name }}"
    spec:
      interval: 1m
      timeout: 20m
      install:
        createNamespace: true
        timeout: 15m
        remediation:
          retries: 3
      targetNamespace: "{{ .Metadata.Namespace }}"
      chart:
        spec:
          chart: "{{ base .Chart.kubeStarrocks.repository }}"
          version: "{{ .Chart.kubeStarrocks.version }}"
          sourceRef:
            kind: HelmRepository
            name: "{{ .Metadata.Name }}-repo"
            namespace: "{{ .Metadata.Namespace }}"
      values:
        operator:
          nameOverride: "{{ .Metadata.Name }}"
          starrocksOperator:
            enabled: true
            image:
              repository: "{{ .Image.starrocksOperator.registry }}/{{ .Image.starrocksOperator.repository }}"
              tag: "{{ .Image.starrocksOperator.tag }}"
        starrocks:
          nameOverride: "{{ .Metadata.Name }}"
          starrocksCluster:
            name: "{{ .Metadata.Name }}"
          starrocksFESpec:
            replicas: {{ .Config.feReplicas }}
            image:
              repository: "{{ .Image.fe.registry }}/{{ .Image.fe.repository }}"
              tag: "{{ .Image.fe.tag }}"
            resources:
              requests: {cpu: "{{ .Config.feCpu }}", memory: "{{ .Config.feMemory }}"}
              limits: {cpu: "{{ .Config.feCpu }}", memory: "{{ .Config.feMemory }}"}
            storageSpec:
              name: fe
              storageSize: "{{ .Config.feMetaStorageSize }}"
              logStorageSize: "{{ .Config.feLogStorageSize }}"
          starrocksBeSpec:
            replicas: {{ .Config.beReplicas }}
            image:
              repository: "{{ .Image.be.registry }}/{{ .Image.be.repository }}"
              tag: "{{ .Image.be.tag }}"
            resources:
              requests: {cpu: "{{ .Config.beCpu }}", memory: "{{ .Config.beMemory }}"}
              limits: {cpu: "{{ .Config.beCpu }}", memory: "{{ .Config.beMemory }}"}
            storageSpec:
              name: be
              storageSize: "{{ .Config.beStorageSize }}"
              logStorageSize: "{{ .Config.beLogStorageSize }}"

    ---
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: "{{ .Metadata.Name }}-landing"
    spec:
      hostnames:
        - "{{ .Metadata.Name }}.{{ .Cluster.DomainName }}"
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: default-awc
          namespace: istio-ingress
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - kind: Service
              name: "{{ .Metadata.Name }}-fe-service"
              port: 8030
