apiVersion: ecosystem.awc.cloudera.com/v1alpha10
kind: Blueprint
metadata:
  name: starrocks
spec:
  owner: StarRocks
  description: Blazing-fast OLAP analytics engine (FE + BE) via the kube-starrocks
    chart.
  outcome: OLAP analytics
  instances:
  - name: starrocks
    engine: starrocks-ace-engine
    minimumVersion: 1.11.4
  hardwareTiers:
  - name: default
    cluster:
      nodeGroups:
      - id: starrocks-nodes
        category: worker
        displayName: StarRocks Nodes
        nodeCount:
          default: 1
          minimum: 1
        resources:
          minimum:
            cpu: '8'
            memory: 32Gi
            hasGPU: false
          hint: 'Recommended: 16 CPU and 32Gi memory per node.'
        storage:
          disk:
            default: 100Gi
            minimum: 50Gi
  ui:
    displayName: StarRocks
