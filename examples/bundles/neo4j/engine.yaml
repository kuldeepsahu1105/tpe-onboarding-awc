apiVersion: ecosystem.awc.cloudera.com/v1alpha10
kind: Engine
metadata:
  name: neo4j-ace-engine
  annotations:
    ecosystem.awc.cloudera.com/requires-embedded-registry: "true"
spec:
  displayName: "Neo4j"
  description: "Native graph database (Community) with Browser UI and Bolt."

  imageCatalog: neo4j-images-5-26-0
  chartCatalog: neo4j-charts-5-26-0

  configSchema:
    type: object
    properties:
      replicas:
        type: integer
        default: 1
        minimum: 1
        description: "Number of Neo4j replicas"
      storageSize:
        type: string
        default: "100Gi"
        description: "Persistent volume size for Neo4j data"
      cpu:
        type: string
        default: "4"
        description: "CPU request/limit per pod"
      memory:
        type: string
        default: "16Gi"
        description: "Memory request/limit per pod"

  provides:
    - name: landingPage
      capability: landing-page
      value: |
        url: "https://neo4j-{{ .Metadata.Namespace }}.{{ .Cluster.DomainName }}"
    - name: connection
      capability: neo4j-connection
      value: |
        host: "{{ .Metadata.Name }}"
        boltPort: "{{ .Metadata.Name }}"
        credentialsSecret: "{{ .Metadata.Name }}"

  healthChecks:
    - resource:
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        name: "{{ .Metadata.Name }}"
      condition:
        type: Ready
        status: "True"

  template: |
    apiVersion: security.awc.cloudera.com/v1alpha1
    kind: AuthConfig
    metadata:
      name: default
      namespace: "{{ .Metadata.Namespace }}"
    spec:
      meshMode: Ambient
      enableAWCAuth: false
    ---
    apiVersion: source.toolkit.fluxcd.io/v1
    kind: HelmRepository
    metadata:
      name: "{{ .Metadata.Name }}-repo"
    spec:
      interval: 5m
      type: oci
      url: oci://{{ .Chart.neo4j.registry }}/{{ dir .Chart.neo4j.repository }}
    ---
    apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    metadata:
      name: "{{ .Metadata.Name }}"
    spec:
      interval: 1m
      timeout: 20m
      install:
        createNamespace: true
        timeout: 15m
        remediation:
          retries: 3
      targetNamespace: "{{ .Metadata.Namespace }}"
      chart:
        spec:
          chart: "{{ base .Chart.neo4j.repository }}"
          version: "{{ .Chart.neo4j.version }}"
          sourceRef:
            kind: HelmRepository
            name: "{{ .Metadata.Name }}-repo"
            namespace: "{{ .Metadata.Namespace }}"
      values:
        image:
          repository: "{{ .Image.neo4j.registry }}/{{ .Image.neo4j.repository }}"
          tag: "{{ .Image.neo4j.tag }}"
        replicaCount: "{{ .Config.replicas }}"
        resources:
          requests:
            cpu: "{{ .Config.cpu }}"
            memory: "{{ .Config.memory }}"
          limits:
            cpu: "{{ .Config.cpu }}"
            memory: "{{ .Config.memory }}"
        persistence:
          size: "{{ .Config.storageSize }}"
        service:
          port: 7687
    ---
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: "{{ .Metadata.Name }}-landing"
    spec:
      hostnames:
        - "neo4j-{{ .Metadata.Namespace }}.{{ .Cluster.DomainName }}"
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: default-awc
          namespace: istio-ingress
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - kind: Service
              name: "{{ .Metadata.Name }}"
              port: 7474
