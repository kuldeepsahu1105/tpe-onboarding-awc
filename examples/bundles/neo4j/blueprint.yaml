apiVersion: ecosystem.awc.cloudera.com/v1alpha10
kind: Blueprint
metadata:
  name: neo4j
spec:
  owner: Neo4j, Inc.
  description: Native graph database (Community) with Browser UI and Bolt.
  outcome: Graph database
  instances:
  - name: neo4j
    engine: neo4j-ace-engine
    minimumVersion: 5.26.0
  hardwareTiers:
  - name: default
    cluster:
      nodeGroups:
      - id: neo4j-nodes
        category: worker
        displayName: Neo4j Nodes
        nodeCount:
          default: 1
          minimum: 1
        resources:
          minimum:
            cpu: '4'
            memory: 16Gi
            hasGPU: false
          hint: 'Recommended: 8 CPU and 32Gi memory per node.'
        storage:
          disk:
            default: 100Gi
            minimum: 50Gi
  ui:
    displayName: Neo4j
