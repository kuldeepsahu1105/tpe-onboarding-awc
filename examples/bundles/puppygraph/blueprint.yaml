apiVersion: ecosystem.awc.cloudera.com/v1alpha10
kind: Blueprint
metadata:
  name: puppygraph
spec:
  owner: PuppyGraph
  description: Zero ETL graph on lakehouse data via Helm on AWC.
  outcome: Zero-ETL graph queries
  instances:
  - name: puppygraph
    engine: puppygraph-ace-engine
    minimumVersion: 1.1.0
  hardwareTiers:
  - name: default
    cluster:
      nodeGroups:
      - id: puppygraph-nodes
        category: worker
        displayName: PuppyGraph Nodes
        nodeCount:
          default: 2
          minimum: 1
        resources:
          minimum:
            cpu: '8'
            memory: 32Gi
            hasGPU: false
          hint: 'Recommended: 16 CPU and 32Gi memory per node.'
        storage:
          disk:
            default: 200Gi
            minimum: 100Gi
  ui:
    displayName: PuppyGraph
