apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sample-engine-role
  namespace: example-namespace
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sample-engine-rolebinding
  namespace: example-namespace
subjects:
