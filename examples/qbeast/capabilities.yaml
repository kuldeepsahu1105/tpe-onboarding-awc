apiVersion: ecosystem.awc.cloudera.com/v1alpha10
kind: Capability
metadata:
  name: qbeast-workspace
spec:
  schema:
    type: object
    # Only the public endpoints. Spark Connect stays inside the workspace: the
    # portal reaches it in its own namespace, and other engines must not bind to it
    # (AWC networking routes cluster-local addresses across the Console's clusters).
    # Both required since 1.3.12, as in Cloudera's onboarding toolkit reference.
    required:
      - portal
      - mcp
    properties:
      portal:
        type: object
        description: "Public URL of the Qbeast portal"
        required:
          - url
        properties:
          url:
            type: string
      mcp:
        type: object
        description: "Public URL of the Qbeast MCP server (Knox JWT authentication)"
        required:
          - url
        properties:
          url:
            type: string
