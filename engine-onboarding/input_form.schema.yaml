# JSON Schema for engine-onboarding/input_form.yaml (version v1).
# Validate with: python3 -c "import yaml,jsonschema,yaml; ..."
$schema: https://json-schema.org/draft/2020-12/schema
title: ACEEngineOnboardingForm
type: object
required:
  - version
  - directory
  - engine
  - imageCatalog
  - chartCatalog
  - helm
properties:
  version:
    const: v1
  directory:
    type: string
    pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
    description: Plugin directory name under ace-engines (e.g. neo4j).
  engine:
    type: object
    required:
      - name
      - displayName
      - description
    properties:
      name:
        type: string
        pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
      displayName:
        type: string
      description:
        type: string
      operator:
        type: string
        description: Optional Operator CR name when using operator-backed engines.
      dependencies:
        type: array
        items:
          type: object
  imageCatalog:
    type: object
    required:
      - name
      - images
    properties:
      name:
        type: string
      images:
        type: array
        minItems: 1
        items:
          type: object
          required:
            - id
            - registry
            - repository
            - tag
          properties:
            id:
              type: string
            registry:
              type: string
            repository:
              type: string
            tag:
              type: string
  chartCatalog:
    type: object
    required:
      - name
      - charts
    properties:
      name:
        type: string
      charts:
        type: array
        minItems: 1
        items:
          type: object
          required:
            - id
            - registry
            - repository
            - version
          properties:
            id:
              type: string
            registry:
              type: string
            repository:
              type: string
            version:
              type: string
  dependencies:
    type: object
    description: >
      Engine dependencies (Polaris/HMS/CDE pattern). auto = provisioned with instance;
      ref/optional = expect existing EngineInstance or Blueprint instance.
    properties:
      entries:
        type: array
        items:
          type: object
          required:
            - name
            - engine
            - type
          properties:
            name:
              type: string
            engine:
              type: string
            type:
              type: string
              enum:
                - auto
                - ref
                - optional
            version:
              type: string
              description: Pinned version for type auto (e.g. postgres 18.0.0).
            minimumVersion:
              type: string
              description: Minimum version for type ref or optional.
            config:
              type: object
              description: Passed to auto dependency EngineInstance config.
  helm:
    type: object
    required:
      - chartID
      - values
    properties:
      chartID:
        type: string
      values:
        type: string
      installRetries:
        type: integer
        default: 3
      upgradeRetries:
        type: integer
        default: 3
  provides:
    type: array
    items:
      type: object
  configSchema:
    type: object
  template:
    type: string
  healthChecks:
    type: array
    items:
      type: object
  capabilities:
    type: array
    description: Custom Capability CR documents (without apiVersion/kind wrapper optional).
    items:
      type: object
  features:
    type: object
    properties:
      generatedCredentials:
        type: object
        properties:
          enabled:
            type: boolean
          username:
            type: string
          secretSuffix:
            type: string
            default: "-auth"
          passwordLength:
            type: integer
            default: 24
          extraB64EncData:
            type: object
            additionalProperties:
              type: string
            description: >
              Extra secret data keys whose values are Go-template expressions
              (e.g. NEO4J_AUTH line using $password).
      authConfig:
        type: object
        properties:
          enabled:
            type: boolean
          configKey:
            type: string
            default: istioEnabled
  rbac:
    type: object
    properties:
      preset:
        type: string
        enum:
          - none
          - helm-basic
          - helm-auth
        default: helm-auth
      clusterRoleName:
        type: string
        description: Role name. Defaults to {directory}-namespaced-role.
  blueprint:
    type: object
    properties:
      enabled:
        type: boolean
        default: true
      name:
        type: string
      owner:
        type: string
        default: Cloudera
      description:
        type: string
      outcome:
        type: string
      minimumVersion:
        type: string
      instanceName:
        type: string
      uiDisplayName:
        type: string
      hardwareTier:
        type: object
      additionalInstances:
        type: array
        description: Extra engines shipped in the same Blueprint (onboard together).
        items:
          type: object
          required:
            - name
            - engine
          properties:
            name:
              type: string
            engine:
              type: string
            minimumVersion:
              type: string
            version:
              type: string
      existingEngines:
        type: array
        description: Engines already on the cluster; listed in Blueprint only (see tpe-onboarding blueprint compose).
        items:
          type: object
          required:
            - name
            - engine
          properties:
            name:
              type: string
            engine:
              type: string
            minimumVersion:
              type: string
            version:
              type: string
      instances:
        type: array
        description: Full Blueprint instances list override (skips auto composition).
        items:
          type: object
  exampleInstance:
    type: object
    properties:
      name:
        type: string
      config:
        type: object
  readme:
    type: object
    properties:
      title:
        type: string
      architectureNotes:
        type: string
      authenticationNotes:
        type: string
  mirror:
    type: object
    description: Upstream chart/images to copy into the partner OCI registry before publish.
    properties:
      skip:
        type: boolean
        default: false
        description: Set true when charts/images are already in destinationRegistry.
      chart:
        type: object
        properties:
          repoUrl:
            type: string
            description: Helm repo URL or oci:// prefix for OCI charts.
          name:
            type: string
          version:
            type: string
      images:
        type: array
        items:
          type: object
          properties:
            source:
              type: string
              description: Full pull reference (docker.io/neo4j:5.26.0-community).
            repository:
              type: string
              description: Destination path under publish.namespace (e.g. cloudera_thirdparty/hardened/neo4j).
            tag:
              type: string
  publish:
    type: object
    description: AWC marketplace CLI publish settings (awc-marketplace validate/publish).
    properties:
      enabled:
        type: boolean
        default: false
      destinationRegistry:
        type: string
        description: Partner OCI registry host (no path).
      namespace:
        type: string
        description: Repository namespace/prefix on the registry (e.g. neo4j).
      version:
        type: string
        description: Marketplace engine/blueprint version (defaults to blueprint.minimumVersion).
      schemaVersion:
        type: integer
        default: 1
      skipImagesAndChartsOnPublish:
        type: boolean
        default: true
        description: Use --skip-images --skip-charts when mirror.sh already pushed artifacts.
  ociRegister:
    type: object
    description: Example config for awc-oci-register on the AWC control plane (Section 3).
    properties:
      enabled:
        type: boolean
        default: false
      registryHost:
        type: string
      marketplacePrefix:
        type: string
      auth:
        type: object
        properties:
          kind:
            type: string
            enum:
              - gcr
              - basic
              - ecr
              - acr
          keyFile:
            type: string
          username:
            type: string
          passwordFile:
            type: string
          region:
            type: string
          registryName:
            type: string
